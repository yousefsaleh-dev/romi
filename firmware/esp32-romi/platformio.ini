; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:romi-devkit-v1]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
	-DCORE_DEBUG_LEVEL=1
  -DROMI_ENABLE_AUDIO=0
lib_ignore = WebSockets
lib_deps =
	bblanchon/ArduinoJson@7.4.3
	madhephaestus/ESP32Servo@3.2.1

[env:romi-full-devkit-v1]
extends = env:romi-devkit-v1
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DROMI_ENABLE_AUDIO=1
  -DNODEBUG_WEBSOCKETS
  -DWEBSOCKETS_MAX_DATA_SIZE=65536
  -DWEBSOCKETS_TCP_TIMEOUT=2000
extra_scripts = pre:scripts/websocket_limits.py
lib_ignore =
lib_deps =
  ${env:romi-devkit-v1.lib_deps}
  links2004/WebSockets@2.7.3
